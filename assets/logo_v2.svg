<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" role="img" aria-label="Nanobrowser Free AI logo">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="browser" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#e0e7ff" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.6" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="10" y="10" width="220" height="220" rx="52" fill="url(#tile)"/>
  <rect x="10" y="10" width="220" height="220" rx="52" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>

  <!-- browser window -->
  <g transform="translate(64 60)">
    <rect x="0" y="0" width="112" height="86" rx="16" fill="url(#browser)"/>
    <!-- top bar -->
    <path d="M0 16 a16 16 0 0 1 16 -16 h80 a16 16 0 0 1 16 16 v10 H0 Z" fill="#c7d2fe"/>
    <!-- dots -->
    <circle cx="14" cy="11" r="3.2" fill="#fb7185"/>
    <circle cx="26" cy="11" r="3.2" fill="#fbbf24"/>
    <circle cx="38" cy="11" r="3.2" fill="#34d399"/>
    <!-- address line -->
    <rect x="12" y="34" width="88" height="9" rx="4.5" fill="#e0e7ff"/>
    <!-- content lines -->
    <rect x="12" y="52" width="64" height="7" rx="3.5" fill="#e0e7ff"/>
    <rect x="12" y="66" width="88" height="7" rx="3.5" fill="#eef2ff"/>
  </g>

  <!-- AI spark node -->
  <g filter="url(#glow)" transform="translate(150 156)">
    <circle r="20" fill="url(#spark)"/>
    <path d="M0 -9 L3 -2 L10 -2 L4 3 L6 10 L0 5 L-6 10 L-4 3 L-10 -2 L-3 -2 Z" fill="#fff7ed"/>
  </g>
</svg>
